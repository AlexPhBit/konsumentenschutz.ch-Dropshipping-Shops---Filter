name: Build Konsumentenschutz - AdGuard Filter
permissions:
  contents: write

on:
  schedule:
    - cron: '0 10,19 * * *'
  workflow_dispatch:

env:
  SOURCE_URL: "https://www.konsumentenschutz.ch/online-ratgeber/dropshipping-die-stolpersteine-beim-onlinehandel-mit-billigware-aus-china/"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install dependencies
      run: pip install beautifulsoup4

    - name: Download page
      run: |
        curl -fsSL \
          --retry 2 --retry-delay 5 --connect-timeout 30 --max-time 120 \
          -A "Mozilla/5.0 (compatible; adguard-filter-bot/1.0; +https://github.com/${{ github.repository }})" \
          "$SOURCE_URL" -o data.html

    - name: Convert to filter.txt
      run: python3 convert.py data.html

    - name: Update & Push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Plausibilität: lieber nichts ändern als eine kaputte Liste veröffentlichen
        DOMAINS=$(grep -c '^||' filter.txt 2>/dev/null || true)
        if [ "${DOMAINS:-0}" -lt 300 ]; then
          echo "::error::Nur ${DOMAINS:-0} Domains in der neuen filter.txt (Minimum 300), kein Commit"
          exit 1
        fi

        git add filter.txt

        # Zeitstempel-Zeilen ignorieren, nur echte Änderungen zählen
        if git diff --cached --quiet -I '^! (Generated|Last run|Last change):'; then
          echo "Keine Änderungen"
          exit 0
        fi

        git commit -m "Update filter ($(date -u +%Y-%m-%dT%H:%M:%SZ)) [$DOMAINS domains]"
        git pull --rebase origin main
        git push origin main
